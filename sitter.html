<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Sitter Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: { 50: '#f0f3ff', 500: '#6366f1', 600: '#4f46e5' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .day-cell { min-height: 100px; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-baby-carriage"></i></div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">Baby Sitter Portal</h1>
                    <p class="text-xs text-slate-500">View attendance & send requests</p>
                </div>
            </div>
            <input type="month" id="monthPicker" value="2026-09" onchange="fetchRealtimeData()" class="border p-1.5 rounded-xl text-xs font-bold text-slate-700 outline-none">
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-6 space-y-6">

        <!-- Sitter Bio Profile Card -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img id="sitterAvatar" src="https://via.placeholder.com/150" class="w-16 h-16 rounded-2xl object-cover border-2 border-brand-500">
                <div>
                    <h3 id="sitterBioName" class="font-bold text-slate-800">My Profile</h3>
                    <p id="sitterBioBank" class="text-xs text-slate-500">Bank Info: Not Uploaded</p>
                </div>
            </div>
            <button onclick="document.getElementById('bioUploadModal').classList.remove('hidden')" class="px-4 py-2.5 bg-brand-600 text-white text-xs font-bold rounded-xl shadow-md"><i class="fa-solid fa-upload mr-1"></i> Upload Profile & NIC</button>
        </div>

        <!-- Earned Summary -->
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex justify-between items-center">
            <div>
                <span class="text-xs text-emerald-600 font-bold uppercase tracking-wider block">Total Net Salary Earned</span>
                <span id="sitterNetEarned" class="text-2xl font-extrabold text-emerald-700">LKR 0</span>
            </div>
            <i class="fa-solid fa-wallet text-emerald-500 text-3xl"></i>
        </div>

        <!-- Calendar -->
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
            <div class="calendar-grid bg-slate-100 border-b text-center text-xs font-bold text-slate-500 uppercase py-2">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid bg-slate-200 gap-px"></div>
        </div>
    </main>

    <!-- Request Modal -->
    <div id="sitterReqModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4">
            <div class="flex justify-between border-b pb-2">
                <h3 id="reqModalDateTitle" class="font-bold text-slate-800">Send Leave / Half Day Request</h3>
                <button onclick="closeReqModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border">
                <span class="text-xs font-bold text-slate-700">Request Leave / Half Day?</span>
                <input type="checkbox" id="reqToggle" class="w-5 h-5 accent-brand-600 cursor-pointer">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1">Reason / Note</label>
                <input type="text" id="reqRemark" placeholder="e.g. Taking half day for doctor visit" class="w-full p-2 border rounded-xl text-sm">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeReqModal()" class="px-4 py-2 border rounded-xl text-xs">Cancel</button>
                <button onclick="saveSitterRequest()" class="px-4 py-2 bg-brand-600 text-white font-bold rounded-xl text-xs">Submit & Send WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Direct Upload Modal -->
    <div id="bioUploadModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between border-b pb-2">
                <h3 class="font-bold text-slate-800">Update Profile & NIC Copies</h3>
                <button onclick="document.getElementById('bioUploadModal').classList.add('hidden')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div><label class="font-bold block mb-1">Full Name</label><input type="text" id="upName" class="w-full p-2 border rounded-xl"></div>
                <div><label class="font-bold block mb-1">Address</label><input type="text" id="upLoc" class="w-full p-2 border rounded-xl"></div>
                <div><label class="font-bold block mb-1">Bank Account Info</label><input type="text" id="upBank" class="w-full p-2 border rounded-xl"></div>
                <div><label class="font-bold block mb-1">Profile Photo (Direct File)</label><input type="file" id="upPhotoFile" accept="image/*" class="w-full p-1 border rounded-xl"></div>
                <div><label class="font-bold block mb-1">NIC Front Copy (Direct File)</label><input type="file" id="upNicFrontFile" accept="image/*" class="w-full p-1 border rounded-xl"></div>
                <div><label class="font-bold block mb-1">NIC Back Copy (Direct File)</label><input type="file" id="upNicBackFile" accept="image/*" class="w-full p-1 border rounded-xl"></div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="document.getElementById('bioUploadModal').classList.add('hidden')" class="px-4 py-2 border rounded-xl">Cancel</button>
                <button onclick="saveSitterBioData()" class="px-4 py-2 bg-brand-600 text-white font-bold rounded-xl">Save & Send Alerts</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE DATABASE LINK
        const FIREBASE_DB_URL = "https://babysitter-tracker-7ce0e-default-rtdb.firebaseio.com/"; // <--- PASTE YOUR FIREBASE URL HERE

        const MALITH_NUM = "94787365590";
        const SHYAMINI_NUM = "0769192553";
        let activeDayNum = null, monthData = {}, sitterBio = {};

        window.onload = function() { fetchRealtimeData(); };

        async function fetchRealtimeData() {
            if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("YOUR_FIREBASE")) return renderCalendar();
            const monthVal = document.getElementById('monthPicker').value;
            try {
                const resData = await fetch(`${FIREBASE_DB_URL}/data_${monthVal}.json`).then(r => r.json());
                const resBio = await fetch(`${FIREBASE_DB_URL}/sitter_bio.json`).then(r => r.json());
                monthData = resData || {};
                sitterBio = resBio || {};
                if (sitterBio.name) document.getElementById('sitterBioName').innerText = sitterBio.name;
                if (sitterBio.bank) document.getElementById('sitterBioBank').innerText = `Bank: ${sitterBio.bank}`;
                if (sitterBio.photo) document.getElementById('sitterAvatar').src = sitterBio.photo;
                renderCalendar();
            } catch(e) { console.error(e); }
        }

        function renderCalendar() {
            const monthVal = document.getElementById('monthPicker').value;
            const [year, month] = monthVal.split('-').map(Number);
            const firstDay = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            let totalEarned = 0;

            for (let i = 0; i < firstDay; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'bg-slate-50 day-cell' }));

            for (let day = 1; day <= daysInMonth; day++) {
                const rec = monthData[day] || { status: 'absent', rate: 1300, advance: 0, leaveReq: false };
                let earned = 0;
                if (rec.status === 'present') earned = parseFloat(rec.rate) || 1300;
                else if (rec.status === 'halfday') earned = (parseFloat(rec.rate) || 1300) / 2;

                totalEarned += (earned - (parseFloat(rec.advance) || 0));

                const cell = document.createElement('div');
                cell.className = `${rec.status === 'present' ? 'bg-emerald-50' : (rec.status === 'halfday' ? 'bg-amber-50' : 'bg-white')} p-2 day-cell flex flex-col justify-between cursor-pointer border-r border-b border-slate-100`;
                cell.onclick = () => openReqModal(day);
                cell.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${rec.status !== 'absent' ? 'bg-slate-800 text-white' : 'text-slate-700 bg-slate-100'}">${day}</span>
                        ${rec.leaveReq ? `<span class="bg-rose-500 text-white text-[9px] px-1 font-bold rounded">Requested</span>` : ''}
                    </div>
                    ${rec.status !== 'absent' ? `<div class="text-[10px] text-slate-600 font-semibold mt-1"><i class="fa-regular fa-clock text-[9px]"></i> ${rec.inTime || '--'} - ${rec.outTime || '--'}</div>` : ''}
                    <div class="text-[10px] font-bold text-emerald-700 mt-2">${earned > 0 ? 'LKR ' + earned.toLocaleString() : ''}</div>
                `;
                grid.appendChild(cell);
            }
            document.getElementById('sitterNetEarned').innerText = 'LKR ' + (totalEarned > 0 ? totalEarned : 0).toLocaleString();
        }

        function openReqModal(day) {
            activeDayNum = day;
            const rec = monthData[day] || { remark: '', leaveReq: false };
            document.getElementById('reqModalDateTitle').innerText = `Request Day ${day}`;
            document.getElementById('reqToggle').checked = rec.leaveReq || false;
            document.getElementById('reqRemark').value = rec.remark || '';
            document.getElementById('sitterReqModal').classList.remove('hidden');
        }

        function closeReqModal() { document.getElementById('sitterReqModal').classList.add('hidden'); }

        async function saveSitterRequest() {
            const monthVal = document.getElementById('monthPicker').value;
            const rec = monthData[activeDayNum] || { status: 'absent', rate: 1300, advance: 0 };
            rec.leaveReq = document.getElementById('reqToggle').checked;
            rec.remark = document.getElementById('reqRemark').value;

            monthData[activeDayNum] = rec;
            if (FIREBASE_DB_URL && !FIREBASE_DB_URL.includes("YOUR_FIREBASE")) {
                await fetch(`${FIREBASE_DB_URL}/data_${monthVal}/${activeDayNum}.json`, { method: 'PUT', body: JSON.stringify(rec) });
            }

            const alertMsg = `*Baby Sitter Leave Request*\nDate: ${monthVal}-${activeDayNum}\nRequest Active: ${rec.leaveReq ? 'YES' : 'NO'}\nNote: ${rec.remark}`;
            sendDualWhatsAppAlerts(alertMsg);
            closeReqModal();
            renderCalendar();
        }

        function fileToBase64(file) {
            return new Promise((resolve) => {
                if (!file) resolve(null);
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.readAsDataURL(file);
            });
        }

        async function saveSitterBioData() {
            const photoFile = document.getElementById('upPhotoFile').files[0];
            const nicFrontFile = document.getElementById('upNicFrontFile').files[0];
            const nicBackFile = document.getElementById('upNicBackFile').files[0];

            if (photoFile) sitterBio.photo = await fileToBase64(photoFile);
            if (nicFrontFile) sitterBio.nicFront = await fileToBase64(nicFrontFile);
            if (nicBackFile) sitterBio.nicBack = await fileToBase64(nicBackFile);

            sitterBio.name = document.getElementById('upName').value || sitterBio.name;
            sitterBio.location = document.getElementById('upLoc').value || sitterBio.location;
            sitterBio.bank = document.getElementById('upBank').value || sitterBio.bank;

            if (FIREBASE_DB_URL && !FIREBASE_DB_URL.includes("YOUR_FIREBASE")) {
                await fetch(`${FIREBASE_DB_URL}/sitter_bio.json`, { method: 'PUT', body: JSON.stringify(sitterBio) });
            }

            const alertMsg = `*Baby Sitter Bio-Data Updated*\nName: ${sitterBio.name}\nLocation: ${sitterBio.location}\nBank: ${sitterBio.bank}`;
            sendDualWhatsAppAlerts(alertMsg);
            document.getElementById('bioUploadModal').classList.add('hidden');
            fetchRealtimeData();
        }

        function sendDualWhatsAppAlerts(msg) {
            window.open(`https://wa.me/${MALITH_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
            setTimeout(() => { window.open(`https://wa.me/${SHYAMINI_NUM}?text=${encodeURIComponent(msg)}`, '_blank'); }, 1000);
        }
    </script>
</body>
</html>
